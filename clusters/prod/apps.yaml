# Applications: apps/prod, with SOPS decryption (the sops-age secret that
# HomeLab's playbooks/flux_bootstrap.yml creates from the age key). Waits for
# the platform layer (infrastructure.yaml).
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: infrastructure
  interval: 10m0s
  path: ./apps/prod
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m0s
  wait: true

# Applications: apps/prod, with SOPS decryption (the sops-age secret that
# HomeLab's playbooks/flux_bootstrap.yml creates from the age key).
# Gets dependsOn: infrastructure once Flux adopts the platform layer.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 10m0s
  path: ./apps/prod
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m0s
  wait: true

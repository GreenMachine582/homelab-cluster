---
# LoadBalancer IPs on the site LAN (192.168.50.0/24), for the Gateway and any
# other LoadBalancer Service. Must stay outside the site router's DHCP pool
# and clear of the nodes' static IPs (.10, .11, .12, .21).
# TODO before merge: confirm the router's DHCP pool ends below .240.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: site-lan
spec:
  blocks:
    - start: "192.168.50.240"
      stop: "192.168.50.250"

---
# Discord, for Flux deploy events (alert.yaml). The webhook URL is the
# secret's `address` (discord-webhook.sops.yaml, see docs/SECRETS.md).
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: discord
  namespace: flux-system
spec:
  type: discord
  username: Flux
  secretRef:
    name: discord-webhook

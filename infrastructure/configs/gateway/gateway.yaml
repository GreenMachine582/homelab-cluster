---
# The shared Gateway (M4): one LoadBalancer IP for every LAN service under
# *.home.green-tech-hub.com. Cilium runs it on Envoy, so the IP is announced
# only from homelab/l7-proxy=supported nodes (infrastructure/configs/cilium).
#
# The address is pinned to the first pool IP, so the PC's hosts entries
# (HomeLab k8s_client) don't change if the Gateway is recreated.
#
# HTTPS takes routes from any namespace; each service adds an HTTPRoute with
# parentRef sectionName: https. HTTP only carries the redirect below.
#
# https-public (M5.5) serves public <name>.green-tech-hub.com, reached only
# through the tunnel: cloudflared keeps the public Host and SNI. Its wildcard
# is a suffix match that also covers *.home names, but the more specific
# https listener wins for those. No HTTP listener for it: cloudflared always
# connects over TLS, and Cloudflare redirects browsers to HTTPS.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab
  namespace: gateway
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: 192.168.50.240
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.home.green-tech-hub.com"
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.home.green-tech-hub.com"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-home-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-public
      protocol: HTTPS
      port: 443
      hostname: "*.green-tech-hub.com"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-public-tls
      allowedRoutes:
        namespaces:
          from: All
---
# Every HTTP request → the same URL over HTTPS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: gateway
spec:
  parentRefs:
    - name: homelab
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

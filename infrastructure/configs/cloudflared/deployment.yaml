---
# Public access (M4): outbound-only connections to Cloudflare, no inbound
# ports. Keep the image version the same as HomeLab's cloudflared_version
# (the controller's CLI).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  # One replica: a second on the same node (below) adds little. Updates still
  # have no gap, because the new pod connects before the old one stops.
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
      annotations:
        # Restart on a config change; kustomize doesn't hash this ConfigMap.
        homelab/config-rev: "2"
    spec:
      # It sends traffic to the Gateway, so it must run where Envoy runs
      # (CONTRIBUTING.md). Today that's only rpi-03 (laptop-01 is tainted).
      # Go back to 2 replicas when another Envoy node can take one.
      nodeSelector:
        homelab/l7-proxy: supported
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.1
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config/config.yaml
            - run
          ports:
            - name: metrics
              containerPort: 2000
          # Ready once a tunnel connection is registered.
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
          # Alive while the process answers. Not /ready, which fails whenever
          # Cloudflare's edge is unreachable and would restart-loop the pod.
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: metrics
            initialDelaySeconds: 10
            failureThreshold: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: cloudflared-config
        - name: creds
          secret:
            secretName: cloudflared-tunnel-credentials

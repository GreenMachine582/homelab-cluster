---
# The locally managed "homelab" tunnel (M4): ingress rules live here, not in
# the Cloudflare dashboard. Each public hostname also needs its DNS record:
#   cloudflared tunnel route dns homelab <name>.green-tech-hub.com
# See docs/CLOUDFLARE.md.
#
# Public <name>.green-tech-hub.com goes to the shared Gateway with its own
# Host and SNI (M5.5, decision 42): no httpHostHeader rewrite.
# originServerName is the public name, so the origin TLS check verifies the
# Gateway's *.green-tech-hub.com certificate (https-public listener). Each
# service adds a public HTTPRoute on https-public, and cloudflared's
# allow-backends policy lists its backend (networkpolicy.yaml).
#
# Every hostname here must pass scripts/public-guard.py (CI): the namespace it
# reaches is hardened first. docs/ADDING_A_SERVICE.md "Before going public".
# whoami stays as a canary for the tunnel → Gateway path (M5.5 PR 3's test,
# kept on 29 Oct 2026). It echoes request headers and pod IPs, nothing more.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cloudflared
data:
  config.yaml: |
    tunnel: 0906ae8b-a6d6-49d7-80f4-6bc4d724fcca
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    # The site network drops outbound UDP 7844, so QUIC never connects; with
    # the default (auto) each QUIC attempt burns ~10 s before falling back.
    protocol: http2
    ingress:
      - hostname: whoami.green-tech-hub.com
        service: https://cilium-gateway-homelab.gateway.svc.cluster.local:443
        originRequest:
          originServerName: whoami.green-tech-hub.com
      - service: http_status:404

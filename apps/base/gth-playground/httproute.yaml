---
# https://playground.home.green-tech-hub.com on the shared Gateway
# (infrastructure/configs/gateway). LAN only: no tunnel rule.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gth-playground
  namespace: gth-playground
spec:
  parentRefs:
    - name: homelab
      namespace: gateway
      sectionName: https
  hostnames:
    - playground.home.green-tech-hub.com
  rules:
    - backendRefs:
        - name: gth-playground
          port: 80

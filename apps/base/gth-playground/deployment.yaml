---
# The greentechhub-ui playground: a demo of every gth-* component, on fixture
# data. LAN only, with no tunnel rule: its persona switcher lets anyone act as
# a demo admin (docs/M5_WORKLOADS.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gth-playground
  namespace: gth-playground
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gth-playground
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gth-playground
    spec:
      # It never calls the Kubernetes API.
      automountServiceAccountToken: false
      # Behind the Gateway, so on a node that runs Envoy (CONTRIBUTING.md).
      nodeSelector:
        homelab/l7-proxy: supported
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gth-playground
          # Built by greentechhub-ui's playground-image workflow from its
          # release tags; Renovate bumps the version and digest.
          image: ghcr.io/greenmachine582/greentechhub-ui-playground:0.20.0@sha256:280286f4685674fa400bd653e79d6dd75819b7acf1a532cbc36c57380491549d
          ports:
            - name: http
              containerPort: 8500
          # No /health endpoint: the index page is the check.
          readinessProbe:
            httpGet:
              path: /
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 10m, memory: 96Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

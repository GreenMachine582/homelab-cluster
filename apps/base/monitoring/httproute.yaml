---
# https://grafana.home.green-tech-hub.com on the shared Gateway
# (infrastructure/configs/gateway). LAN only: no tunnel rule.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: homelab
      namespace: gateway
      sectionName: https
  hostnames:
    - grafana.home.green-tech-hub.com
  rules:
    - backendRefs:
        - name: kps-grafana
          port: 80

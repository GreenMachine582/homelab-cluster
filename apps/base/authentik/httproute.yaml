---
# https://auth.home.green-tech-hub.com on the shared Gateway
# (infrastructure/configs/gateway). LAN only: no tunnel rule.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik
  namespace: authentik
spec:
  parentRefs:
    - name: homelab
      namespace: gateway
      sectionName: https
  hostnames:
    - auth.home.green-tech-hub.com
  rules:
    - backendRefs:
        - name: authentik-server
          port: 80

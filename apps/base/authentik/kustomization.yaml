---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - httproute.yaml
  - networkpolicy.yaml
# Authentik config as code (blueprints/, docs/AUTHENTIK.md). The chart mounts
# authentik-blueprints on the worker. Its name is fixed: the mount path
# includes it, and Authentik keys each blueprint by path and name, so a new
# path would clash. authentik-blueprints-hash holds the same files only for
# its hashed name, which kustomizeconfig.yaml writes into a worker pod
# annotation: any change restarts the worker, which applies every blueprint
# at start. Keep both file lists the same.
configurations:
  - kustomizeconfig.yaml
configMapGenerator:
  - name: authentik-blueprints
    namespace: authentik
    files: &blueprints
      - blueprints/mfa.yaml
      - blueprints/brand.yaml
      - blueprints/admins.yaml
      - blueprints/grafana.yaml
      - blueprints/sources.yaml
      - blueprints/hardening.yaml
    options:
      disableNameSuffixHash: true
  - name: authentik-blueprints-hash
    namespace: authentik
    files: *blueprints

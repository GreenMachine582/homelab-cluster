---
# Authentik (M5 PR 5): single sign-on for the cluster's apps, starting with
# Grafana (PR 6). LAN only at auth.home (httproute.yaml). Its database is
# the shared Postgres: role and database `authentik`, made by
# apps/base/postgres/app-databases-job.yaml. Since 2025.10 it needs no
# Redis.
#
# Secrets (SECRET_KEY, the database password, the first-start akadmin
# password and email) come from authentik-secrets (docs/SECRETS.md); the
# rest of the config is plain env below. The image is the chart's
# appVersion: Renovate bumps the chart, and both move together.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  releaseName: authentik
  interval: 30m
  # The first start runs every database migration, slow on a Pi.
  timeout: 15m
  chart:
    spec:
      chart: authentik
      version: "2026.8.5"
      sourceRef:
        kind: HelmRepository
        name: goauthentik
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    authentik:
      existingSecret:
        secretName: authentik-secrets
    # Config as code: blueprints/ via kustomization.yaml's configMapGenerator
    # (docs/AUTHENTIK.md). Objects they define are reset to git on every
    # apply, so change them there, not in the UI.
    blueprints:
      configMaps:
        - authentik-blueprints
    global:
      # Values the blueprints read with !Env.
      envFrom:
        - secretRef:
            name: authentik-grafana-oidc
      # env wins over the secret's envFrom, so nothing here can be
      # overridden by accident.
      env:
        - { name: AUTHENTIK_POSTGRESQL__HOST, value: postgres.postgres.svc }
        - { name: AUTHENTIK_POSTGRESQL__NAME, value: authentik }
        - { name: AUTHENTIK_POSTGRESQL__USER, value: authentik }
        - { name: AUTHENTIK_POSTGRESQL__PORT, value: "5432" }
        - { name: AUTHENTIK_LOG_LEVEL, value: info }
        - { name: AUTHENTIK_ERROR_REPORTING__ENABLED, value: "false" }
      priorityClassName: homelab-critical
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    # The chart doesn't test readOnlyRootFilesystem, so it stays off.
    server:
      replicas: 1
      containerSecurityContext: &container
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      # Behind the Gateway, so on a node that runs Envoy (CONTRIBUTING.md).
      nodeSelector:
        homelab/l7-proxy: supported
      resources:
        requests: { cpu: 100m, memory: 512Mi }
        limits: { memory: 1Gi }
    worker:
      replicas: 1
      # kustomize replaces this with authentik-blueprints-hash's hashed name
      # (kustomizeconfig.yaml), so a blueprint change restarts the worker.
      podAnnotations:
        homelab-blueprints: authentik-blueprints-hash
      containerSecurityContext: *container
      # Not on rpi-01 (2 GB; docs/M5_WORKLOADS.md › Placement).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [rpi-01]
      resources:
        requests: { cpu: 100m, memory: 512Mi }
        limits: { memory: 1Gi }
    postgresql:
      enabled: false
    geoip:
      enabled: false

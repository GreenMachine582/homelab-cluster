---
# Daily dumps (pg-dump-cronjob.yaml). Copied to the backup drive by
# pg-dump-offnode-cronjob.yaml and fetched home by HomeLab's pg_dump_fetch.yml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-dumps
  namespace: postgres
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-nvme
  volumeName: postgres-dumps
  resources:
    requests:
      storage: 20Gi

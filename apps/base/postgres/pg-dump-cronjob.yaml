---
# Daily pg_dumpall of every database, gzipped, newest 7 kept, on the
# postgres-dumps PV (rpi-03, next to the data). HomeLab's pg_dump_fetch.yml
# copies them home; that's the only off-node copy until the NFS backup target
# (M4 PR 9). A failed run leaves a failed Job, which M5 PR 6 alerts on.
# Test run: kubectl -n postgres create job --from=cronjob/pg-dump dump-test
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-dump
  namespace: postgres
spec:
  schedule: "30 2 * * *"
  timeZone: Australia/Sydney
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-dump
              image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
              env:
                - name: PGHOST
                  value: postgres
                - name: PGUSER
                  value: postgres
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-superuser
                      key: password
              command: [bash, -euo, pipefail, -c]
              # Written under a temporary name and renamed, so a failed
              # dump never looks like a complete one.
              args:
                - |
                  out=/dumps/pg_dumpall-$(date +%F-%H%M).sql.gz
                  pg_dumpall --clean --if-exists | gzip > "$out.partial"
                  mv "$out.partial" "$out"
                  ls -1t /dumps/pg_dumpall-*.sql.gz | tail -n +8 | xargs -r rm --
                  rm -f /dumps/*.partial
                  ls -lh /dumps
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
              volumeMounts:
                - name: dumps
                  mountPath: /dumps
          volumes:
            - name: dumps
              persistentVolumeClaim:
                claimName: postgres-dumps

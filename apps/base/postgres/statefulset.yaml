---
# Shared Postgres for every app (M5): one database and role per app, made by
# app-databases-job.yaml. One replica on rpi-03, where its PV is.
# Guaranteed QoS (requests = limits) plus homelab-critical, so it's the last
# pod evicted under memory pressure. Majors need a dump and restore, so
# Renovate only offers 18.x (.github/renovate.json5).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: postgres
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      priorityClassName: homelab-critical
      automountServiceAccountToken: false
      # No fsGroup: the PV directory is already 999:999 0700, and a
      # recursive fsGroup change would break PGDATA's required permissions.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-superuser
                  key: password
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, postgres, -h, 127.0.0.1]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [pg_isready, -U, postgres, -h, 127.0.0.1]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: 500m, memory: 1Gi }
          volumeMounts:
            # The 18 image keeps PGDATA at /var/lib/postgresql/18/docker.
            - name: data
              mountPath: /var/lib/postgresql
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: run
          emptyDir: { sizeLimit: 16Mi }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 256Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-nvme
        resources:
          requests:
            storage: 20Gi

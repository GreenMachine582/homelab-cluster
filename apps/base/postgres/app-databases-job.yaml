---
# One role and database per app: each key of the postgres-app-passwords
# secret is an app name, and its value is that role's password. Creates the
# role and database if missing and always sets the password, so it's safe
# to re-run.
#
# A Job runs once. The force annotation lets Flux replace it when its spec
# changes. After adding an app or rotating a password, bump homelab/run
# below so it runs again (docs/SECRETS.md).
apiVersion: batch/v1
kind: Job
metadata:
  name: app-databases
  namespace: postgres
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 3
  template:
    metadata:
      annotations:
        homelab/run: "1"
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app-databases
          image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
          env:
            - name: PGHOST
              value: postgres
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-superuser
                  key: password
          command: [bash, -euo, pipefail, -c]
          # Names and passwords reach SQL as psql variables, quoted by
          # format(%I/%L), never pasted into the statement text.
          args:
            - |
              until pg_isready -q; do echo "waiting for postgres"; sleep 3; done
              for f in /apps/*; do
                name=$(basename "$f")
                if [[ ! $name =~ ^[a-z][a-z0-9_]*$ ]]; then
                  echo "skipping '$name': app names are lowercase letters, digits and _" >&2
                  exit 1
                fi
                psql -v ON_ERROR_STOP=1 -q -v name="$name" -v pass="$(cat "$f")" <<'SQL'
              SELECT format('CREATE ROLE %I LOGIN', :'name')
                WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'name') \gexec
              SELECT format('ALTER ROLE %I PASSWORD %L', :'name', :'pass') \gexec
              SELECT format('CREATE DATABASE %I OWNER %I', :'name', :'name')
                WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'name') \gexec
              SQL
                echo "ready: $name"
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - name: apps
              mountPath: /apps
              readOnly: true
      volumes:
        - name: apps
          secret:
            secretName: postgres-app-passwords

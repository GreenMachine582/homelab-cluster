---
# https://whoami.home.green-tech-hub.com on the shared Gateway
# (infrastructure/configs/gateway).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  namespace: whoami
spec:
  parentRefs:
    - name: homelab
      namespace: gateway
      sectionName: https
  hostnames:
    - whoami.home.green-tech-hub.com
  rules:
    - backendRefs:
        - name: whoami
          port: 80
